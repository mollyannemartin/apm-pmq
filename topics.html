<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PMQ Topics</title><link rel="stylesheet" href="standalone.css"><script src="topics-data.js"></script></head><body><header class="site-header"><div class="site-bar"><a class="site-brand" href="index.html">APM PMQ Revision</a><nav class="site-nav"><a href="learn.html">⚡ Learn</a><a href="flashcards.html">🧠 Flashcards</a><a href="tests.html">🎯 Tests</a><a href="topics.html">📚 Topics</a><a href="read.html">📖 Read</a><a href="weak-areas.html">🚨 Weak Areas</a></nav></div></header><main class="page"><h1>All 24 PMQ learning objectives</h1><p class="muted">This is the complete topic list currently built into your revision material. Use Learn for teaching; use this page as a map.</p><input id="topicSearch" class="search" placeholder="Search the 24 topics..."><div id="topicGrid" class="grid" style="margin-top:20px"></div></main><script>const g=document.getElementById('topicGrid');function render(){const q=document.getElementById('topicSearch').value.toLowerCase();g.innerHTML=PMQ_TOPICS.filter(t=>(t.title+' '+t.area+' '+t.summary).toLowerCase().includes(q)).map(t=>`<a class="card topic-card" href="learn.html?topic=${encodeURIComponent(t.id)}"><h3>${t.title}</h3><small>${t.area}</small><p>${t.summary}</p></a>`).join('')||'<p>No topics found.</p>'}document.getElementById('topicSearch').oninput=render;render();</script></body></html>
