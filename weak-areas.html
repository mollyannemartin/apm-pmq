<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="learning-system.css">
<link rel="stylesheet" href="site-tidy.css">

</head>
<body>
<header class="site-header">
  <div class="site-header-inner">
    <a class="site-brand" href="index.html">APM PMQ Revision</a>
    <nav class="site-nav" aria-label="Main navigation">
      <a href="learn.html">⚡ Learn</a>
      <a href="flashcards.html">🧠 Flashcards</a>
      <a href="tests.html">🎯 Tests</a>
      <a href="life.html">🧠 My Life</a>
      <a href="weak-areas.html">🚨 Weak Areas</a>
    </nav>
  </div>
</header>
<main class="site-main">

<section class="page-hero">
  <span class="pmq-kicker">REVIEW</span>
  <h1>🚨 Weak Areas</h1>
  <p>Topics you mark as needing another go are stored on this device.</p>
</section>
<div id="weak-list" class="page-card"></div>
<script>
(function(){
  const el=document.getElementById('weak-list');
  let s={};
  try{s=JSON.parse(localStorage.getItem('pmq5min_state_v1')||'{"weak":{}}')}catch(e){}
  const ids=Object.keys(s.weak||{});
  if(!ids.length){el.innerHTML='<h2>Nothing flagged yet 🎉</h2><p>When you finish a lesson and choose “Need another go”, it will appear here.</p>';return;}
  const names={
    "project-bau":"Projects vs BAU","risk-issue":"Risk vs Issue","stakeholders":"Stakeholders",
    "change-control":"Change Control","linear":"Linear Life Cycle","iterative":"Iterative Life Cycle",
    "output-outcome-benefit":"Output, Outcome & Benefit"
  };
  el.innerHTML='<h2>Topics to revisit</h2><ul>'+ids.map(id=>'<li><a href="learn.html">'+(names[id]||id)+'</a></li>').join('')+'</ul>';
})();
</script>

</main>
<footer><p>APM PMQ Revision Tool — Molly</p></footer>

</body>
</html>
