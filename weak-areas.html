<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PMQ Weak Areas</title><link rel="stylesheet" href="standalone.css"></head><body><header class="site-header"><div class="site-bar"><a class="site-brand" href="index.html">APM PMQ Revision</a><nav class="site-nav"><a href="learn.html">⚡ Learn</a><a href="flashcards.html">🧠 Flashcards</a><a href="tests.html">🎯 Tests</a><a href="topics.html">📚 Topics</a><a href="life.html">🧠 My Life</a><a href="weak-areas.html" class="active">🚨 Weak Areas</a></nav></div></header><main class="page"><section class="hero"><p class="eyebrow">TARGETED REVISION</p><h1>🚨 Weak Areas</h1><p>Use this page to find what needs another attempt. Do not use it as a punishment list.</p></section><div class="card"><div id="weakList"></div><div class="actions"><button id="clear" class="button secondary">Clear weak areas</button></div></div></main><script>function render(){let w={};try{w=JSON.parse(localStorage.getItem('pmqWeakAreasV2')||localStorage.getItem('pmqWeakAreas')||'{}')}catch(e){}const entries=Object.entries(w);document.getElementById('weakList').innerHTML=entries.length?'<h2>Topics to revisit</h2><ul>'+entries.map(([k,v])=>`<li><strong>${k}</strong> — ${typeof v==='string'?v:(v.topic||v.label||'Review again')}</li>`).join('')+'</ul>':'<p>No weak areas recorded yet. Start a test or free-type flashcard session.</p>'}render();document.getElementById('clear').onclick=()=>{localStorage.removeItem('pmqWeakAreasV2');localStorage.removeItem('pmqWeakAreas');render()}</script></body></html>
